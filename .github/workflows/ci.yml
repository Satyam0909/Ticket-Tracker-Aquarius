name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test backend
        run: dotnet test backend/SupportTickets.Tests/SupportTickets.Tests.csproj
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, test, format-check, and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run format:check
          npm run build
